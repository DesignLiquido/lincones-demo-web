<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL IndexedDB Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .header {
            background: #252526;
            padding: 12px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #cccccc;
        }
        .run-btn {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .run-btn:hover {
            background: #1177bb;
        }
        .run-btn:active {
            background: #0d5a8f;
        }
        .reset-btn {
            background: #a1260d;
            margin-left: 8px;
        }
        .reset-btn:hover {
            background: #c9371f;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }
        .panel-header {
            background: #2d2d30;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #999;
        }
        #editor {
            flex: 1;
        }
        .results-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .results-content {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }
        .result-message {
            background: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .result-message.success {
            border-left: 3px solid #4ec9b0;
        }
        .result-message.error {
            border-left: 3px solid #f48771;
            color: #f48771;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #2d2d30;
            border-radius: 4px;
            overflow: hidden;
            font-size: 13px;
        }
        th {
            background: #3e3e42;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: #cccccc;
        }
        td {
            padding: 8px 12px;
            border-top: 1px solid #3e3e42;
        }
        tr:hover {
            background: #37373d;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #858585;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>SQL IndexedDB Editor</h1>
        <div>
            <button class="run-btn" onclick="executeSQL()">Run Query (Ctrl+Enter)</button>
            <button class="run-btn reset-btn" onclick="resetDatabase()">Reset Database</button>
        </div>
    </div>
    <div class="container">
        <div class="editor-panel">
            <div class="panel-header">SQL Editor</div>
            <div id="editor"></div>
        </div>
        <div class="results-panel">
            <div class="panel-header">Results</div>
            <div class="results-content" id="results">
                <div class="empty-state">
                    <div class="empty-state-icon">⚡</div>
                    <p>Type your SQL query and press "Run Query" to see results</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        let db = new Dexie('SQLDatabase');
        let tableSchemas = {}; // Store column names for each table

        // Initialize Monaco Editor
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        
        // Disable web workers to avoid console warnings
        window.MonacoEnvironment = {
            getWorker: function(moduleId, label) {
                return new Worker('data:text/javascript;charset=utf-8,' + encodeURIComponent(`
                    self.MonacoEnvironment = { baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/' };
                    importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/base/worker/workerMain.js');
                `));
            }
        };
        
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '-- Sample queries:\n-- CREATE TABLE users (id, name, email)\n-- INSERT INTO users VALUES (1, "John Doe", "john@example.com")\n-- SELECT * FROM users\n\nSELECT * FROM users;',
                language: 'sql',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false }
            });

            // Ctrl+Enter to execute
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, executeSQL);
        });

        // Initialize existing tables and schemas
        async function initializeDB() {
            await db.open();
            
            // Check if we have stored schemas
            if (db.tables.length > 0) {
                const schemasTable = db.table('_schemas');
                if (schemasTable) {
                    const schemas = await schemasTable.toArray();
                    schemas.forEach(s => {
                        if (s.tableName) {
                            tableSchemas[s.tableName] = s.columns;
                        }
                    });
                }
            }
        }

        // Simple SQL parser and executor
        async function executeSQL() {
            const fullText = editor.getValue();
            const resultsDiv = document.getElementById('results');
            
            // Extract SQL statements (ignore comments and empty lines)
            const lines = fullText.split('\n');
            const sqlStatements = [];
            let currentStatement = '';
            
            for (let line of lines) {
                line = line.trim();
                // Skip SQL comments
                if (line.startsWith('--') || line === '') continue;
                
                currentStatement += ' ' + line;
                
                // If line ends with semicolon, it's end of statement
                if (line.endsWith(';')) {
                    sqlStatements.push(currentStatement.trim().replace(/;+$/, ''));
                    currentStatement = '';
                }
            }
            
            // Add any remaining statement
            if (currentStatement.trim()) {
                sqlStatements.push(currentStatement.trim().replace(/;+$/, ''));
            }
            
            if (sqlStatements.length === 0) {
                resultsDiv.innerHTML = '<div class="result-message error">Please enter a SQL query</div>';
                return;
            }
            
            // Execute the last statement (or first if only one)
            const sql = sqlStatements[sqlStatements.length - 1];
            
            console.log('Executing SQL:', sql);

            // Clear results immediately
            resultsDiv.innerHTML = '<div class="result-message">Executing...</div>';

            try {
                // Parse SQL command
                const upperSQL = sql.toUpperCase();
                
                if (upperSQL.startsWith('CREATE TABLE')) {
                    await handleCreateTable(sql);
                    resultsDiv.innerHTML = `<div class="result-message success">✓ CREATE TABLE executed successfully<br><code>${sql}</code></div>`;
                } else if (upperSQL.startsWith('INSERT INTO')) {
                    await handleInsert(sql);
                    resultsDiv.innerHTML = `<div class="result-message success">✓ INSERT INTO executed successfully<br><code>${sql}</code></div>`;
                } else if (upperSQL.startsWith('SELECT')) {
                    const results = await handleSelect(sql);
                    displayResults(results, sql);
                } else if (upperSQL.startsWith('DELETE FROM')) {
                    await handleDelete(sql);
                    resultsDiv.innerHTML = `<div class="result-message success">✓ DELETE FROM executed successfully<br><code>${sql}</code></div>`;
                } else if (upperSQL.startsWith('DROP TABLE')) {
                    await handleDropTable(sql);
                    resultsDiv.innerHTML = `<div class="result-message success">✓ DROP TABLE executed successfully<br><code>${sql}</code></div>`;
                } else {
                    resultsDiv.innerHTML = '<div class="result-message error">Unsupported SQL command</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="result-message error">Error: ${error.message}</div>`;
                console.error(error);
            }
        }

        async function handleCreateTable(sql) {
            const match = sql.match(/CREATE TABLE\s+(\w+)\s*\((.*?)\)/i);
            if (!match) throw new Error('Invalid CREATE TABLE syntax');
            
            const tableName = match[1];
            const columnsStr = match[2];
            
            // Parse column names
            const columns = columnsStr.split(',').map(col => col.trim().split(/\s+/)[0]);
            
            // Store schema
            tableSchemas[tableName] = columns;
            
            // Close and recreate database with new schema
            db.close();
            
            const version = db.verno + 1;
            db = new Dexie('SQLDatabase');
            
            // Build schema object for all tables
            const schemaObj = { '_schemas': 'tableName' };
            for (let table in tableSchemas) {
                schemaObj[table] = '++id';
            }
            
            db.version(version).stores(schemaObj);
            
            await db.open();
            
            // Save schema to _schemas table
            await db.table('_schemas').put({ tableName, columns });
        }

        async function handleInsert(sql) {
            const match = sql.match(/INSERT INTO\s+(\w+)\s+VALUES\s*\((.*?)\)/i);
            if (!match) throw new Error('Invalid INSERT syntax');
            
            const tableName = match[1];
            const valuesStr = match[2];
            const values = valuesStr.split(',').map(v => {
                v = v.trim();
                if (v.startsWith('"') || v.startsWith("'")) {
                    return v.slice(1, -1);
                }
                return isNaN(v) ? v : Number(v);
            });
            
            const table = db.table(tableName);
            if (!table) throw new Error(`Table ${tableName} does not exist`);
            
            // Convert values array to object with column names
            const columns = tableSchemas[tableName] || [];
            const row = {};
            columns.forEach((col, i) => {
                row[col] = values[i];
            });
            
            await table.add(row);
        }

        async function handleSelect(sql) {
            const match = sql.match(/SELECT\s+.*?\s+FROM\s+(\w+)/i);
            if (!match) throw new Error('Invalid SELECT syntax');
            
            const tableName = match[1];
            
            const table = db.table(tableName);
            if (!table) throw new Error(`Table ${tableName} does not exist`);
            
            const data = await table.toArray();
            const schema = tableSchemas[tableName] || [];
            
            return { data, schema };
        }

        async function handleDelete(sql) {
            const match = sql.match(/DELETE FROM\s+(\w+)/i);
            if (!match) throw new Error('Invalid DELETE syntax');
            
            const tableName = match[1];
            const table = db.table(tableName);
            if (!table) throw new Error(`Table ${tableName} does not exist`);
            
            await table.clear();
        }

        async function handleDropTable(sql) {
            const match = sql.match(/DROP TABLE\s+(\w+)/i);
            if (!match) throw new Error('Invalid DROP TABLE syntax');
            
            const tableName = match[1];
            
            // Remove from schemas
            delete tableSchemas[tableName];
            
            // Close and recreate database without this table
            db.close();
            
            const version = db.verno + 1;
            db = new Dexie('SQLDatabase');
            
            // Build schema object for remaining tables
            const schemaObj = { '_schemas': 'tableName' };
            for (let table in tableSchemas) {
                schemaObj[table] = '++id';
            }
            
            db.version(version).stores(schemaObj);
            
            await db.open();
            
            // Remove schema from _schemas table
            await db.table('_schemas').where('tableName').equals(tableName).delete();
        }

        async function resetDatabase() {
            if (!confirm('Are you sure you want to delete the entire database? This cannot be undone.')) {
                return;
            }
            
            try {
                db.close();
                await Dexie.delete('SQLDatabase');
                
                // Recreate empty database
                db = new Dexie('SQLDatabase');
                tableSchemas = {};
                
                document.getElementById('results').innerHTML = `
                    <div class="result-message success">✓ Database reset successfully</div>
                    <div class="empty-state">
                        <div class="empty-state-icon">⚡</div>
                        <p>Type your SQL query and press "Run Query" to see results</p>
                    </div>
                `;
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <div class="result-message error">Error resetting database: ${error.message}</div>
                `;
            }
        }

        function displayResults(results, sql) {
            const resultsDiv = document.getElementById('results');
            
            const { data, schema } = results;
            
            if (!data || data.length === 0) {
                resultsDiv.innerHTML = `<div class="result-message success">✓ Query executed successfully (0 rows)<br><code>${sql}</code></div>`;
                return;
            }
            
            // Use schema if available
            const columns = schema && schema.length > 0 ? schema : Object.keys(data[0]).filter(k => k !== 'id');
            
            const html = `
                <div class="result-message success">✓ Query executed successfully (${data.length} row${data.length > 1 ? 's' : ''})<br><code>${sql}</code></div>
                <table>
                    <thead>
                        <tr>
                            ${columns.map(col => `<th>${col}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(row => `
                            <tr>
                                ${columns.map(col => `<td>${row[col] !== undefined && row[col] !== null ? row[col] : '-'}</td>`).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            resultsDiv.innerHTML = html;
        }

        // Initialize on load
        initializeDB();
    </script>
</body>
</html>
