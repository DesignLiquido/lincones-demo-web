<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor LinConEs - SQL em Português</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .header {
            background: #252526;
            padding: 12px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #cccccc;
        }
        .header h1 small {
            font-size: 12px;
            color: #858585;
            font-weight: 400;
        }
        .run-btn {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .run-btn:hover {
            background: #1177bb;
        }
        .run-btn:active {
            background: #0d5a8f;
        }
        .reset-btn {
            background: #a1260d;
            margin-left: 8px;
        }
        .reset-btn:hover {
            background: #c9371f;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }
        .panel-header {
            background: #2d2d30;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #999;
        }
        #editor {
            flex: 1;
        }
        .results-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .results-content {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }
        .result-message {
            background: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .result-message code {
            display: block;
            margin-top: 8px;
            padding: 8px;
            background: #1e1e1e;
            border-radius: 3px;
            font-size: 12px;
            color: #4ec9b0;
        }
        .result-message.success {
            border-left: 3px solid #4ec9b0;
        }
        .result-message.error {
            border-left: 3px solid #f48771;
            color: #f48771;
        }
        .translation {
            background: #2d2d30;
            border: 1px solid #3e3e42;
            border-left: 3px solid #dcdcaa;
            border-radius: 4px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .translation strong {
            color: #dcdcaa;
        }
        .translation code {
            display: block;
            margin-top: 8px;
            padding: 8px;
            background: #1e1e1e;
            border-radius: 3px;
            font-size: 12px;
            color: #ce9178;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #2d2d30;
            border-radius: 4px;
            overflow: hidden;
            font-size: 13px;
        }
        th {
            background: #3e3e42;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: #cccccc;
        }
        td {
            padding: 8px 12px;
            border-top: 1px solid #3e3e42;
        }
        tr:hover {
            background: #37373d;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #858585;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-header label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            color: #858585;
            cursor: pointer;
        }
        .panel-header label:hover {
            color: #cccccc;
        }
        .ocultar-traducao .translation {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Editor LinConEs <small>SQL em Português</small></h1>
        <div>
            <button class="run-btn" onclick="executeLinConEs()">Executar (Ctrl+Enter)</button>
            <button class="run-btn reset-btn" onclick="reiniciarBancoDeDados()">Resetar Banco</button>
        </div>
    </div>
    <div class="container">
        <div class="editor-panel">
            <div class="panel-header">Editor LinConEs</div>
            <div id="editor"></div>
        </div>
        <div class="results-panel">
            <div class="panel-header">
                Resultados
                <label>
                    <input type="checkbox" id="mostrarTraducao" checked onchange="alternarTraducao(this)">
                    Mostrar tradução SQL
                </label>
            </div>
            <div class="results-content" id="results">
                <div class="empty-state">
                    <div class="empty-state-icon"><img src="recursos/icone-lincones.png" alt="LinConEs"></div>
                    <p>Digite sua consulta em LinConEs e pressione "Executar"</p>
                    <p style="margin-top: 16px; font-size: 12px;">
                        Exemplo: SELECIONAR * DE usuarios
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
    <script src="lincones.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        let db = new Dexie('LinConEsDatabase');
        let tableSchemas = {}; // Armazenar nomes de colunas para cada tabela

        // Traduzir LinConEs para SQL usando o pipeline Lexador-Parser-Translator
        function traduzirLinconesParaSql(lincones) {
            const retornoLexador = lexador.mapear(lincones.split('\n'));

            if (retornoLexador.erros && retornoLexador.erros.length > 0) {
                const erro = retornoLexador.erros[0];
                throw new Error(`Erro léxico na linha ${erro.linha}: ${erro.mensagem}`);
            }

            const retornoAvaliador = avaliadorSintatico.analisar(retornoLexador);

            if (retornoAvaliador.erros && retornoAvaliador.erros.length > 0) {
                throw new Error(retornoAvaliador.erros[0].mensagem || 'Erro sintático');
            }

            return tradutorSqlAnsi.traduzir(retornoAvaliador.comandos);
        }

        // Inicializar Monaco Editor
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        
        // Desabilitar workers externos para evitar problemas de CORS, usando um worker embutido
        window.MonacoEnvironment = {
            getWorker: function(moduleId, label) {
                return new Worker('data:text/javascript;charset=utf-8,' + encodeURIComponent(`
                    self.MonacoEnvironment = { baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/' };
                    importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/base/worker/workerMain.js');
                `));
            }
        };
        
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: `-- Exemplos em LinConEs (SQL em Português):
-- CRIAR TABELA usuarios (id INTEIRO, nome TEXTO, email TEXTO)
-- INSERIR EM usuarios (id, nome, email) VALORES (1, "João Silva", "joao@exemplo.com")
-- SELECIONAR * DE usuarios

SELECIONAR * DE usuarios;`,
                language: 'sql',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false }
            });

            // Ctrl/Cmd + Enter para executar LinConEs
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, executeLinConEs);
        });

        // Inicializar banco de dados e carregar esquemas armazenados
        async function inicializarBancoDeDados() {
            await db.open();
            
            // Verificar se temos esquemas armazenados
            if (db.tables.length > 0) {
                const schemasTable = db.table('_schemas');
                if (schemasTable) {
                    const schemas = await schemasTable.toArray();
                    schemas.forEach(s => {
                        if (s.tableName) {
                            tableSchemas[s.tableName] = s.columns;
                        }
                    });
                }
            }
        }

        // Execute LinConEs
        async function executeLinConEs() {
            const fullText = editor.getValue();
            const resultsDiv = document.getElementById('results');
            
            // Extrair declarações LinConEs (ignorar comentários e linhas vazias)
            const lines = fullText.split('\n');
            const linconesStatements = [];
            let currentStatement = '';
            
            for (let line of lines) {
                line = line.trim();
                // Ignorar comentários SQL
                if (line.startsWith('--') || line === '') continue;
                
                currentStatement += ' ' + line;
                
                // Se a linha termina com ponto e vírgula, é o fim da declaração
                if (line.endsWith(';')) {
                    linconesStatements.push(currentStatement.trim().replace(/;+$/, ''));
                    currentStatement = '';
                }
            }
            
            // Adicionar última declaração se não terminar com ponto e vírgula
            if (currentStatement.trim()) {
                linconesStatements.push(currentStatement.trim().replace(/;+$/, ''));
            }
            
            if (linconesStatements.length === 0) {
                resultsDiv.innerHTML = '<div class="result-message error">Por favor, digite uma consulta LinConEs</div>';
                return;
            }
            
            // Executar apenas o último comando LinConEs para simplicidade
            const lincones = linconesStatements[linconesStatements.length - 1];

            // Limpar resultados antes de qualquer operação
            resultsDiv.innerHTML = '<div class="result-message">Executando...</div>';

            try {
                const sql = traduzirLinconesParaSql(lincones);

                console.log('LinConEs:', lincones);
                console.log('Traduzido para SQL:', sql);

                // Mostrar tradução
                resultsDiv.innerHTML = `
                    <div class="translation">
                        <strong>Tradução LinConEs → SQL:</strong>
                        <code>${sql}</code>
                    </div>
                `;
                
                // Compreender comando SQL e executar ação correspondente
                const upperSQL = sql.toUpperCase();
                
                if (upperSQL.startsWith('CREATE TABLE')) {
                    await executarCriacaoTabela(sql);
                    resultsDiv.innerHTML += `<div class="result-message success">✓ CRIAR TABELA executado com sucesso<br><code>${lincones}</code></div>`;
                } else if (upperSQL.startsWith('INSERT INTO')) {
                    await executarInsercao(sql);
                    resultsDiv.innerHTML += `<div class="result-message success">✓ INSERIR executado com sucesso<br><code>${lincones}</code></div>`;
                } else if (upperSQL.startsWith('SELECT')) {
                    const results = await executarSelecao(sql);
                    exibirResultados(results, lincones, sql);
                } else if (upperSQL.startsWith('DELETE FROM')) {
                    await executarExclusao(sql);
                    resultsDiv.innerHTML += `<div class="result-message success">✓ EXCLUIR executado com sucesso<br><code>${lincones}</code></div>`;
                } else if (upperSQL.startsWith('DROP TABLE')) {
                    await executarExclusaoTabela(sql);
                    resultsDiv.innerHTML += `<div class="result-message success">✓ REMOVER TABELA executado com sucesso<br><code>${lincones}</code></div>`;
                } else {
                    resultsDiv.innerHTML += '<div class="result-message error">Comando SQL não suportado</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="result-message error">Erro: ${error.message}</div>`;
                console.error(error);
            }
        }

        async function executarCriacaoTabela(sql) {
            const match = sql.match(/CREATE TABLE\s+(\w+)\s*\((.*?)\)/is);
            if (!match) throw new Error('Sintaxe inválida para CRIAR TABELA');
            
            const tableName = match[1].toLowerCase();
            const columnsStr = match[2];
            
            // Analisar nomes das colunas (simplificado - apenas obter a primeira palavra de cada definição de coluna)
            const columns = columnsStr.split(',').map(col => {
                const colName = col.trim().split(/\s+/)[0];
                return colName.toLowerCase();
            });
            
            // Armazenar esquema
            tableSchemas[tableName] = columns;
            
            // Fechar e recriar banco de dados com novo esquema
            db.close();
            
            const version = db.verno + 1;
            db = new Dexie('LinConEsDatabase');
            
            // Construir objeto de esquema para todas as tabelas
            const schemaObj = { '_schemas': 'tableName' };
            for (let table in tableSchemas) {
                schemaObj[table] = '++id';
            }
            
            db.version(version).stores(schemaObj);
            
            await db.open();
            
            // Salvar esquema na tabela _schemas
            await db.table('_schemas').put({ tableName, columns });
        }

        async function executarInsercao(sql) {
            const match = sql.match(/INSERT INTO\s+(\w+)\s*(?:\(([^)]*)\)\s*)?VALUES\s*\((.*?)\)/is);
            if (!match) throw new Error('Sintaxe inválida para INSERIR');

            const tableName = match[1].toLowerCase();
            const explicitColumns = match[2] ? match[2].split(',').map(c => c.trim().toLowerCase()) : null;
            const valuesStr = match[3];
            const values = valuesStr.split(',').map(v => {
                v = v.trim();
                if (v.startsWith('"') || v.startsWith("'")) {
                    return v.slice(1, -1);
                }
                return isNaN(v) ? v : Number(v);
            });

            const table = db.table(tableName);
            if (!table) throw new Error(`Tabela ${tableName} não existe`);

            // Usar colunas explícitas se fornecidas, caso contrário usar esquema armazenado
            const columns = explicitColumns || tableSchemas[tableName] || [];
            const row = {};
            columns.forEach((col, i) => {
                row[col] = values[i];
            });

            await table.add(row);
        }

        async function executarSelecao(sql) {
            const match = sql.match(/SELECT\s+.*?\s+FROM\s+(\w+)/i);
            if (!match) throw new Error('Sintaxe inválida para SELECIONAR');
            
            const tableName = match[1].toLowerCase();
            
            const table = db.table(tableName);
            if (!table) throw new Error(`Tabela ${tableName} não existe`);
            
            const data = await table.toArray();
            const schema = tableSchemas[tableName] || [];
            
            return { data, schema };
        }

        async function executarExclusao(sql) {
            const match = sql.match(/DELETE FROM\s+(\w+)/i);
            if (!match) throw new Error('Sintaxe inválida para EXCLUIR');
            
            const tableName = match[1].toLowerCase();
            const table = db.table(tableName);
            if (!table) throw new Error(`Tabela ${tableName} não existe`);
            
            await table.clear();
        }

        async function executarExclusaoTabela(sql) {
            const match = sql.match(/DROP TABLE\s+(\w+)/i);
            if (!match) throw new Error('Sintaxe inválida para REMOVER TABELA');
            
            const tableName = match[1].toLowerCase();
            
            // Remover de schemas armazenados
            delete tableSchemas[tableName];
            
            // Fechar e recriar banco de dados sem a tabela removida
            db.close();
            
            const version = db.verno + 1;
            db = new Dexie('LinConEsDatabase');
            
            // Construir objeto de esquema para as tabelas restantes
            const schemaObj = { '_schemas': 'tableName' };
            for (let table in tableSchemas) {
                schemaObj[table] = '++id';
            }
            
            db.version(version).stores(schemaObj);
            
            await db.open();
            
            // Remover esquema da tabela excluída
            await db.table('_schemas').where('tableName').equals(tableName).delete();
        }

        async function reiniciarBancoDeDados() {
            if (!confirm('Tem certeza que deseja excluir todo o banco de dados? Esta ação não pode ser desfeita.')) {
                return;
            }
            
            try {
                db.close();
                await Dexie.delete('LinConEsDatabase');
                
                // Recriar banco de dados vazio
                db = new Dexie('LinConEsDatabase');
                tableSchemas = {};
                
                document.getElementById('results').innerHTML = `
                    <div class="result-message success">✓ Banco de dados resetado com sucesso</div>
                    <div class="empty-state">
                        <div class="empty-state-icon">🇧🇷</div>
                        <p>Digite sua consulta em LinConEs e pressione "Executar"</p>
                    </div>
                `;
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <div class="result-message error">Erro ao resetar banco: ${error.message}</div>
                `;
            }
        }

        function exibirResultados(results, lincones, sql) {
            const resultsDiv = document.getElementById('results');
            
            const { data, schema } = results;
            
            if (!data || data.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="translation">
                        <strong>Tradução LinConEs → SQL:</strong>
                        <code>${sql}</code>
                    </div>
                    <div class="result-message success">✓ Consulta executada com sucesso (0 linhas)<br><code>${lincones}</code></div>
                `;
                return;
            }
            
            // Usar colunas do esquema se disponível, caso contrário usar chaves do primeiro objeto de resultado (excluindo 'id')
            const columns = schema && schema.length > 0 ? schema : Object.keys(data[0]).filter(k => k !== 'id');
            
            const html = `
                <div class="translation">
                    <strong>Tradução LinConEs → SQL:</strong>
                    <code>${sql}</code>
                </div>
                <div class="result-message success">✓ Consulta executada com sucesso (${data.length} linha${data.length > 1 ? 's' : ''})<br><code>${lincones}</code></div>
                <table>
                    <thead>
                        <tr>
                            ${columns.map(col => `<th>${col}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(row => `
                            <tr>
                                ${columns.map(col => `<td>${row[col] !== undefined && row[col] !== null ? row[col] : '-'}</td>`).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            resultsDiv.innerHTML = html;
        }

        function alternarTraducao(checkbox) {
            document.getElementById('results').classList.toggle('ocultar-traducao', !checkbox.checked);
        }

        // Inicializar banco de dados ao carregar a página
        inicializarBancoDeDados();
    </script>
</body>
</html>
